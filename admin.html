<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<title>Área Administrativa</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
font-family:Arial;
background:#f5f7fb;
margin:0;
padding:40px;
}

.container{
max-width:900px;
margin:auto;
}

.card{
background:white;
padding:20px;
border-radius:10px;
margin-bottom:20px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

button{
padding:10px 15px;
border:none;
border-radius:6px;
cursor:pointer;
margin-right:10px;
}

.ver{background:#1a73e8;color:white;}
.atualizar{background:#ff9800;color:white;}
.excluir{background:#e53935;color:white;}

</style>

</head>

<body>

<div class="container">

<h2>Área Administrativa</h2>

<div class="card">

<h3>Rastreamentos</h3>
<div id="lista"></div>

</div>

</div>

<script>

const SUPABASE_URL="https://opiwznepfjcinxrymrxw.supabase.co"
const SUPABASE_KEY="sb_publishable_F7z4q7UuxxNc13r4rDubZA_LsFF1fEB"

const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY)

async function carregar(){

const {data}=await db
.from("trackings_test")
.select("*")
.order("id",{ascending:false})

const lista=document.getElementById("lista")

lista.innerHTML=""

for(const r of data){

const {data:views}=await db
.from("tracking_views")
.select("*")
.eq("code",r.code)
.order("viewed_at",{ascending:false})

const totalViews = views ? views.length : 0

let ultimaHora="--"
let cidade="--"
let device="--"
let horario="--"

if(views && views.length>0){

const ultima = views[0]

ultimaHora = new Date(ultima.viewed_at).toLocaleString("pt-BR",{timeZone:"America/Sao_Paulo"})
cidade = ultima.city || "--"
horario = ultima.delivery_time || "--"

if(ultima.device){
if(ultima.device.includes("iPhone")) device="iPhone"
else if(ultima.device.includes("Android")) device="Android"
else if(ultima.device.includes("Windows")) device="Windows PC"
else device="Outro"
}

}

lista.innerHTML+=`

<div style="border:1px solid #ddd;padding:15px;margin-bottom:10px;border-radius:6px">

<b>${r.code}</b>

<div style="margin-top:6px;color:#444">

⏰ horário escolhido: ${horario}<br>
👁 ${totalViews} visualizações<br>
🕒 última visita: ${ultimaHora}<br>
📍 ${cidade}<br>
📱 ${device}

</div>

<br>

${r.recipient_name}<br>
${r.address}

<div style="margin-top:10px">

<button class="ver" onclick="ver('${r.code}')">Ver</button>

</div>

</div>

`

}

}

function ver(code){
window.open("/rastreamento.html?code="+code,"_blank")
}

carregar()

</script>

</body>
</html>
