<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Rastreamento</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
font-family:Arial;
background:#f5f7fb;
padding:40px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
max-width:700px;
margin:auto;
}

.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.4);
display:flex;
align-items:center;
justify-content:center;
}

.modal-box{
background:white;
padding:30px;
border-radius:10px;
text-align:center;
}

.horarios button{
margin:5px;
padding:10px 15px;
background:#ff6a00;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="card">

<h2 id="codigo"></h2>

<p><b>Destinatário:</b> <span id="destinatario"></span></p>
<p><b>Endereço:</b> <span id="endereco"></span></p>

</div>

<div class="modal" id="modalHorario">

<div class="modal-box">

<h3>Escolher horário de entrega</h3>

<div class="horarios">

<button onclick="escolherHorario('10:00')">10:00</button>
<button onclick="escolherHorario('11:00')">11:00</button>
<button onclick="escolherHorario('13:00')">13:00</button>
<button onclick="escolherHorario('14:00')">14:00</button>
<button onclick="escolherHorario('15:00')">15:00</button>
<button onclick="escolherHorario('16:00')">16:00</button>
<button onclick="escolherHorario('17:00')">17:00</button>
<button onclick="escolherHorario('18:00')">18:00</button>
<button onclick="escolherHorario('19:00')">19:00</button>

</div>

<br>

<button onclick="fechar()">Cancelar</button>

</div>

</div>

<script>

const SUPABASE_URL="https://opiwznepfjcinxrymrxw.supabase.co"
const SUPABASE_KEY="sb_publishable_F7z4q7UuxxNc13r4rDubZA_LsFF1fEB"

const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY)

const urlParams = new URLSearchParams(window.location.search)
const code = urlParams.get("code")

async function carregar(){

const {data}=await db
.from("trackings_test")
.select("*")
.eq("code",code)
.single()

document.getElementById("codigo").innerText=data.code
document.getElementById("destinatario").innerText=data.recipient_name
document.getElementById("endereco").innerText=data.address

registrarView()

}

async function registrarView(){

const device=navigator.userAgent

let city=""

try{

const geo=await fetch("https://ipapi.co/json/")
const geoData=await geo.json()

city=geoData.city

}catch{}

await db.from("tracking_views").insert([{
code:code,
device:device,
city:city,
viewed_at:new Date().toISOString()
}])

}

async function escolherHorario(horario){

await db
.from("tracking_views")
.update({
delivery_time:horario
})
.eq("code",code)

alert("Horário escolhido: "+horario)

location.reload()

}

function fechar(){
document.getElementById("modalHorario").style.display="none"
}

carregar()

</script>

</body>
</html>
