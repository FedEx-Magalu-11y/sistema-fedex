<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FedEx - Rastreamento</title>

<link rel="stylesheet" href="/css/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
.horarioBtn{
padding:8px 12px;
margin:5px;
border:none;
border-radius:6px;
background:#ff6a00;
color:white;
cursor:pointer;
}

.horarioBtn:hover{
opacity:0.9;
}
</style>

</head>

<body>

<div class="tracking-container">

<div class="tracking-content">

<div class="tracking-main-card">

<div class="tracking-header">
<div class="tracking-logo">
<img src="/fedex.png" class="tracking-header-logo">
</div>
</div>

<div class="tracking-code-label">
Seu código de rastreamento
</div>

<div id="codigo" class="tracking-code"></div>

<div class="tracking-info-section">
<div class="tracking-info-item">
<span class="info-label">Destinatário</span>
<span id="destinatario" class="info-value"></span>
</div>
</div>

<div class="tracking-address-section">
<div class="address-header">
<span class="address-label">Endereço de Entrega</span>
</div>
<div id="endereco" class="address-value"></div>
</div>

<div class="tracking-update-bar">
Última atualização em: <span id="atualizacao"></span>
</div>

</div>

<div class="tracking-help-card">

<div class="help-title">
Precisa de Ajuda?
</div>

<button class="help-button support">
Escolher horário de entrega
</button>

<button class="help-button faq">
Perguntas Frequentes
</button>

</div>

<div id="timeline" class="tracking-timeline"></div>

</div>

<div class="tracking-logos">
<img src="/fedex.png" class="tracking-logo-fedex">
<img src="/logo-magalu-azul (1).png" class="tracking-logo-magalu">
</div>

</div>

<!-- CONFIRMAÇÃO -->
<div id="confirmacaoEntrega" style="
display:none;
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
background:#28a745;
color:white;
padding:12px 25px;
border-radius:8px;
font-size:14px;
z-index:9999;
">
Horário confirmado
</div>

<!-- MODAL HORARIO -->
<div id="modalHorario" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
align-items:center;
justify-content:center;
z-index:9999;
">

<div style="
background:white;
padding:30px;
border-radius:10px;
width:320px;
text-align:center;
">

<h3>Escolher horário de entrega</h3>

<div style="margin-top:20px">
<button class="horarioBtn">10:00</button>
<button class="horarioBtn">11:00</button>
<button class="horarioBtn">13:00</button>
<button class="horarioBtn">14:00</button>
<button class="horarioBtn">15:00</button>
<button class="horarioBtn">16:00</button>
<button class="horarioBtn">17:00</button>
<button class="horarioBtn">18:00</button>
<button class="horarioBtn">19:00</button>
</div>

<br>

<button onclick="fecharHorario()">Cancelar</button>

</div>
</div>

<script>

const SUPABASE_URL="https://opiwznepfjcinxrymrxw.supabase.co"
const SUPABASE_KEY="sb_publishable_F7z4q7UuxxNc13r4rDubZA_LsFF1fEB"

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

const params = new URLSearchParams(window.location.search)
const code = params.get("code")

document.getElementById("codigo").innerText = code

function formatarDataBrasil(data){
return new Date(data).toLocaleString("pt-BR",{timeZone:"America/Sao_Paulo"})
}

async function carregar(){

const {data,error} = await db
.from("trackings_test")
.select("*")
.eq("code",code)
.single()

if(error || !data){
document.getElementById("timeline").innerHTML="Código não encontrado"
return
}

document.getElementById("destinatario").innerText=data.recipient_name
document.getElementById("endereco").innerText=data.address

const ultimoEvento=data.timeline[data.timeline.length-1]

document.getElementById("atualizacao").innerText=
formatarDataBrasil(ultimoEvento.date)

const timeline=document.getElementById("timeline")
timeline.innerHTML=""

data.timeline.forEach((evento,index)=>{
timeline.innerHTML+=`
<div class="timeline-item ${index==data.timeline.length-1?"active":""}">
<div class="timeline-content">
<div>${formatarDataBrasil(evento.date)}</div>
<div>${evento.title}</div>
<div>${evento.description}</div>
<div>📍 ${evento.location}</div>
</div>
</div>
`
})

}

carregar()

function abrirHorario(){
document.getElementById("modalHorario").style.display="flex"
}

function fecharHorario(){
document.getElementById("modalHorario").style.display="none"
}

document.querySelector(".support").onclick=abrirHorario

function mostrarConfirmacao(horario){

const box=document.getElementById("confirmacaoEntrega")

box.innerText="Horário confirmado: "+horario
box.style.display="block"

setTimeout(()=>{box.style.display="none"},3000)

}

document.querySelectorAll(".horarioBtn").forEach(btn=>{

btn.onclick=async function(){

const horario=this.innerText

try{

await db
.from("tracking_views")
.insert([
{
code: code,
delivery_time: horario,
viewed_at: new Date().toISOString()
}
])

}catch(e){}

fecharHorario()
mostrarConfirmacao(horario)

}

})

</script>

</body>
</html>
